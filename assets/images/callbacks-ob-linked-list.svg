<text x="360" y="222" fill="#8b949e" font-size="9.5" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Walk list: follow Flink at +0x000 of each node; stop when Flink == _OBJECT_TYPE.CallbackList address</text>
<text x="360" y="248" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Ob callbacks require two separate passes: once for Process type (index 7), once for Thread type (index 8)</text>
