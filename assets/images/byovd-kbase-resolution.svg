<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330">
  <rect width="640" height="330" fill="#0d1117" rx="8"/>
  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
  </defs>

  <text x="320" y="26" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Resolving the Kernel Base Address</text>

  <rect x="160" y="40" width="320" height="44" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="320" y="59"  text-anchor="middle" fill="#58a6ff"  font-size="12" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>NtQuerySystemInformation(11, ...)</text>
  <text x="320" y="76"  text-anchor="middle" fill="#8b949e"  font-size="10" font-family='Segoe UI, Inter, sans-serif'>class 11 = SystemModuleInformation  ·  no privilege required</text>
  <line x1="320" y1="86" x2="320" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="80" y="108" width="480" height="58" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="126" text-anchor="middle" fill="#e6edf3" font-size="11" font-family='Segoe UI, Inter, sans-serif'>RTL_PROCESS_MODULES buffer</text>
  <rect x="100" y="132" width="148" height="26" rx="3" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="174" y="149" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>modules[0] = ntoskrnl.exe</text>
  <rect x="262" y="132" width="100" height="26" rx="3" fill="#30363d" opacity="0.4"/>
  <text x="312" y="149" text-anchor="middle" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>modules[1]</text>
  <rect x="376" y="132" width="168" height="26" rx="3" fill="#30363d" opacity="0.4"/>
  <text x="460" y="149" text-anchor="middle" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>modules[2] ... [N]</text>
  <line x1="320" y1="168" x2="320" y2="188" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="160" y="190" width="320" height="44" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="209" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>kbase = modules[0].ImageBase</text>
  <text x="320" y="226" text-anchor="middle" fill="#8b949e"  font-size="10" font-family='JetBrains Mono, Consolas, monospace'>e.g.  0xfffff800`12340000</text>
  <line x1="320" y1="236" x2="320" y2="256" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="120" y="258" width="400" height="44" rx="5" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
  <text x="320" y="276" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Sanity: kread32(kbase) &amp; 0xFFFF == 0x5A4D</text>
  <text x="320" y="292" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>MZ header at kbase confirms RTCore64 reads kernel memory correctly</text>

  <text x="320" y="322" text-anchor="middle" fill="#8b949e" font-size="9" font-family='Segoe UI, Inter, sans-serif'>All symbols addressed as  kbase + RVA  (Win10 build 18363 values used in examples)</text>
</svg>