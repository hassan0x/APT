<svg xmlns="http://www.w3.org/2000/svg" width="640" height="234" viewBox="0 0 640 234">
<rect x="0" y="0" width="640" height="234" fill="#0f1f38" stroke="none" stroke-width="0" rx="8"/>
<text x="320" y="26" fill="#e6edf3" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">EX_FAST_REF — Pointer Encoding in Callback Arrays</text>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<text x="20" y="52" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace">Array slot raw value:</text>
<text x="220" y="52" fill="#f0883e" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold">ffffbf0f`e823bb5f</text>
<rect x="20" y="62" width="600" height="50" fill="#192d44" stroke="#21262d" stroke-width="1.5" rx="4"/>
<rect x="20" y="62" width="522" height="50" fill="rgba(88,166,255,0.18)" stroke="#58a6ff" stroke-width="1.5" rx="4"/>
<text x="281" y="84" fill="#58a6ff" font-size="12" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Pointer  (bits 63..4)</text>
<text x="281" y="100" fill="#58a6ff" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">ffffbf0f`e823bb5  =>  _EX_CALLBACK_ROUTINE_BLOCK</text>
<rect x="546" y="62" width="74" height="50" fill="rgba(240,136,62,0.18)" stroke="#f0883e" stroke-width="1.5" rx="4"/>
<text x="583" y="84" fill="#f0883e" font-size="14" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">0xF</text>
<text x="583" y="100" fill="#f0883e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">refcnt</text>
<text x="20" y="132" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace">Strip low nibble:</text>
<text x="180" y="132" fill="#e6edf3" font-size="12" font-family="JetBrains Mono,Consolas,monospace">ffffbf0f`e823bb5f  &amp;  0xFFFFFFFFFFFFFFF0</text>
<text x="20" y="154" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace">Result:</text>
<text x="110" y="154" fill="#3fb950" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold">ffffbf0f`e823bb50</text>
<text x="400" y="154" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace">=>  _EX_CALLBACK_ROUTINE_BLOCK</text>
<rect x="20" y="166" width="600" height="36" fill="#192d44" stroke="#21262d" stroke-width="1.5" rx="4"/>
<text x="32" y="180" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace">+0x00</text>
<text x="80" y="180" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace">RundownProtect</text>
<line x1="178" y1="166" x2="178" y2="202" stroke="#21262d" stroke-width="1"/>
<text x="184" y="180" fill="#3fb950" font-size="10" font-family="JetBrains Mono,Consolas,monospace">+0x08</text>
<text x="238" y="180" fill="#3fb950" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold">Function</text>
<text x="308" y="180" fill="#e6edf3" font-size="10" font-family="JetBrains Mono,Consolas,monospace">&lt;- callback addr</text>
<line x1="415" y1="166" x2="415" y2="202" stroke="#21262d" stroke-width="1"/>
<text x="427" y="180" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace">+0x10</text>
<text x="475" y="180" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace">Context</text>
<text x="320" y="212" fill="#8b949e" font-size="9.5" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Run:  lm a  (Function address)  =>  resolves to driver name (e.g. WdFilter, cng)</text>
</svg>