<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="0 0 620 200">
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="620" height="200" fill="#0d1117" rx="8"/>
<text x="310" y="22" fill="#e6edf3" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold" text-anchor="middle">EX_FAST_REF — Pointer Encoding in Callback Arrays</text>

<!-- Raw value from array -->
<text x="40" y="52" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11">Array slot raw value:</text>
<text x="210" y="52" fill="#f0883e" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold">ffffbf0f`e823bb5f</text>

<!-- Bit field boxes -->
<rect x="40" y="62" width="480" height="44" fill="#161b22" stroke="#21262d" rx="4"/>
<!-- pointer part (bits 63:4) -->
<rect x="40" y="62" width="436" height="44" fill="rgba(88,166,255,0.12)" stroke="#58a6ff" stroke-width="1.5" rx="4 0 0 4"/>
<text x="258" y="82" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="bold" text-anchor="middle">Pointer  (bits 63..4)</text>
<text x="258" y="98" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">ffffbf0f e823bb5 → points to _EX_CALLBACK_ROUTINE_BLOCK</text>
<!-- refcount part (bits 3:0) -->
<rect x="477" y="62" width="43" height="44" fill="rgba(240,136,62,0.18)" stroke="#f0883e" stroke-width="1.5" rx="0 4 4 0"/>
<text x="499" y="82" fill="#f0883e" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="bold" text-anchor="middle">0xF</text>
<text x="499" y="97" fill="#f0883e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">refcnt</text>

<!-- mask operation -->
<text x="40" y="130" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11">Strip low nibble:</text>
<text x="180" y="130" fill="#e6edf3" font-family="JetBrains Mono,Consolas,monospace" font-size="12">ffffbf0f`e823bb5f  <tspan fill="#8b949e">&amp;</tspan>  0xFFFFFFFFFFFFFFF0</text>
<text x="40" y="152" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11">Result:</text>
<text x="108" y="152" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold">ffffbf0f`e823bb50</text>
<text x="310" y="152" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11">→  _EX_CALLBACK_ROUTINE_BLOCK</text>

<!-- ROUTINE_BLOCK layout -->
<rect x="40" y="162" width="540" height="26" fill="#161b22" stroke="#21262d" rx="4"/>
<text x="55" y="179" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11">+0x00  RundownProtect</text>
<text x="250" y="179" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="11">+0x08  Function  ← callback address  →  lm a addr  →  WdFilter</text>
</svg>