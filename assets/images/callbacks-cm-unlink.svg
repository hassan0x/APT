<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392">
<rect x="0" y="0" width="720" height="392" fill="#0d1117" stroke="none" stroke-width="0" rx="8"/>
<text x="360" y="26" fill="#e6edf3" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">CmRegisterCallback — Node Unlinking (Before/After)</text>
<defs><marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<text x="16" y="48" fill="#e6edf3" font-size="11" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold">BEFORE:</text>
<rect x="16" y="58" width="140" height="70" fill="rgba(88,166,255,0.18)" stroke="#58a6ff" stroke-width="1.5" rx="4"/>
<text x="86" y="78" fill="#58a6ff" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">CallbackListHead</text>
<text x="86" y="94" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(nt!)</text>
<rect x="188" y="58" width="140" height="70" fill="rgba(248,81,73,0.18)" stroke="#f85149" stroke-width="1.5" rx="4"/>
<text x="258" y="78" fill="#f85149" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">WdFilter Node</text>
<text x="258" y="94" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(target)</text>
<rect x="360" y="58" width="140" height="70" fill="rgba(139,148,158,0.18)" stroke="#8b949e" stroke-width="1.5" rx="4"/>
<text x="430" y="78" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Next Node</text>
<text x="430" y="94" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(other driver)</text>
<line x1="158" y1="85" x2="186" y2="85" stroke="#8b949e" stroke-width="1.5" marker-end="url(#cm)"/>
<line x1="330" y1="85" x2="358" y2="85" stroke="#8b949e" stroke-width="1.5" marker-end="url(#cm)"/>
<line x1="258" y1="128" x2="258" y2="140" stroke="#8b949e" stroke-width="1"/>
<line x1="258" y1="140" x2="86" y2="140" stroke="#8b949e" stroke-width="1"/>
<line x1="86" y1="140" x2="86" y2="128" stroke="#8b949e" stroke-width="1"/>
<line x1="430" y1="128" x2="430" y2="140" stroke="#8b949e" stroke-width="1"/>
<line x1="430" y1="140" x2="258" y2="140" stroke="#8b949e" stroke-width="1"/>
<line x1="258" y1="140" x2="258" y2="128" stroke="#8b949e" stroke-width="1"/>
<rect x="16" y="170" width="688" height="52" fill="rgba(227,179,65,0.18)" stroke="#e3b341" stroke-width="1" rx="4"/>
<text x="360" y="188" fill="#e3b341" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">eq  (nt!CallbackListHead + 0x00)  NextNode_addr   --  HEAD.Flink = NEXT</text>
<text x="360" y="207" fill="#e3b341" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">eq  (NextNode_addr + 0x08)  nt!CallbackListHead    --  NEXT.Blink = HEAD</text>
<text x="16" y="248" fill="#e6edf3" font-size="11" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold">AFTER:</text>
<rect x="16" y="260" width="140" height="70" fill="rgba(88,166,255,0.18)" stroke="#58a6ff" stroke-width="1.5" rx="4"/>
<text x="86" y="280" fill="#58a6ff" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">CallbackListHead</text>
<text x="86" y="296" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(nt!)</text>
<rect x="188" y="260" width="140" height="70" fill="rgba(139,148,158,0.18)" stroke="#8b949e" stroke-width="1.5" rx="4"/>
<text x="258" y="280" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Next Node</text>
<text x="258" y="296" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(other driver)</text>
<rect x="360" y="260" width="140" height="70" fill="none" stroke="#8b949e" stroke-width="1" rx="4"/>
<text x="430" y="280" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">WdFilter Node</text>
<text x="430" y="296" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">(disconnected)</text>
<text x="430" y="312" fill="#8b949e" font-size="9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">never fires</text>
<line x1="158" y1="287" x2="186" y2="287" stroke="#8b949e" stroke-width="1.5" marker-end="url(#cm)"/>
<line x1="258" y1="330" x2="258" y2="344" stroke="#8b949e" stroke-width="1"/>
<line x1="258" y1="344" x2="86" y2="344" stroke="#8b949e" stroke-width="1"/>
<line x1="86" y1="344" x2="86" y2="330" stroke="#8b949e" stroke-width="1"/>
<text x="360" y="356" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">The WdFilter node memory still exists — it is simply bypassed by the list pointers.</text>
<text x="360" y="370" fill="#8b949e" font-size="9.5" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Verify:  dq nt!CallbackListHead  => Flink should now point to NextNode, skipping WdFilter.</text>
</svg>