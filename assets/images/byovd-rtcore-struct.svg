<svg xmlns="http://www.w3.org/2000/svg" width="640" height="346" viewBox="0 0 640 346">
  <rect width="640" height="346" fill="#0d1117" rx="8"/>
  <text x="320" y="24" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>RTCORE_MEM Structure Layout</text>
  <text x="320" y="42" text-anchor="middle" fill="#8b949e"  font-size="10" font-family='Segoe UI, Inter, sans-serif'>#pragma pack(push, 1)  ·  48 bytes total  ·  same buffer for both IOCTLs</text>

  <text x="18"  y="66" fill="#8b949e" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>OFFSET</text>
  <text x="68"  y="66" fill="#8b949e" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>SIZE</text>
  <text x="116"  y="66" fill="#8b949e" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>FIELD</text>
  <text x="222"  y="66" fill="#8b949e" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>DESCRIPTION</text>
  <line x1="10" y1="72" x2="630" y2="72" stroke="#30363d" stroke-width="1"/>
  <rect x="10" y="64" width="620" height="32" fill="#161b22" rx="2"/>
  <text x="18" y="94" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x00</text>
  <text x="68" y="94" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>8 B</text>
  <text x="116" y="94" fill="#8b949e" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>pad0[8]</text>
  <text x="222" y="94" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>ignored — zero the whole struct with {0}</text>
  <rect x="10" y="96" width="620" height="32" fill="#0d1117" rx="2"/>
  <text x="18" y="126" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x08</text>
  <text x="68" y="126" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>8 B</text>
  <text x="116" y="126" fill="#58a6ff" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>Address</text>
  <text x="222" y="126" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>kernel virtual address to read or write</text>
  <rect x="10" y="128" width="620" height="32" fill="#161b22" rx="2"/>
  <text x="18" y="158" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x10</text>
  <text x="68" y="158" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>8 B</text>
  <text x="116" y="158" fill="#8b949e" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>pad1[8]</text>
  <text x="222" y="158" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>ignored</text>
  <rect x="10" y="160" width="620" height="32" fill="#0d1117" rx="2"/>
  <text x="18" y="190" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x18</text>
  <text x="68" y="190" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>4 B</text>
  <text x="116" y="190" fill="#e3b341" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>Size</text>
  <text x="222" y="190" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>bytes to access: 1, 2, or 4  (RTCore maximum)</text>
  <rect x="10" y="192" width="620" height="32" fill="#161b22" rx="2"/>
  <text x="18" y="222" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x1C</text>
  <text x="68" y="222" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>4 B</text>
  <text x="116" y="222" fill="#3fb950" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>Value</text>
  <text x="222" y="222" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>WRITE: data to write  |  READ: data returned here</text>
  <rect x="10" y="224" width="620" height="32" fill="#0d1117" rx="2"/>
  <text x="18" y="254" fill="#8b949e" font-size="11" font-family='JetBrains Mono, Consolas, monospace'>+0x20</text>
  <text x="68" y="254" fill="#8b949e" font-size="10" font-family='JetBrains Mono, Consolas, monospace'>16 B</text>
  <text x="116" y="254" fill="#8b949e" font-size="11" font-weight="bold" font-family='JetBrains Mono, Consolas, monospace'>pad2[16]</text>
  <text x="222" y="254" fill="#8b949e" font-size="10" font-family='Segoe UI, Inter, sans-serif'>ignored</text>
  <line x1="10" y1="290" x2="630" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="14" y="308"    fill="#58a6ff"  font-size="10" font-family='Segoe UI, Inter, sans-serif'>READ:   fill Address+Size, pass &amp;m as both lpInBuffer and lpOutBuffer — Value is filled on return</text>
  <text x="14" y="326" fill="#3fb950" font-size="10" font-family='Segoe UI, Inter, sans-serif'>WRITE:  fill Address+Size+Value, pass &amp;m as both buffers — driver writes Value bytes to Address</text>
</svg>