<text x="585" y="100" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">Session ID: 6</text>
<text x="585" y="120" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">_WMI_LOGGER_CONTEXT</text>
