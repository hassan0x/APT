<!-- Disable note -->
<text x="350" y="245" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">Disable:  eb &lt;EntryBase&gt;+0x60 0  →  zeroes IsEnabled  →  no events dispatched</text>
