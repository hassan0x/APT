<text x="350" y="130" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="11" font-weight="bold" text-anchor="middle">IsEnabled = 1</text>
<text x="350" y="158" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">EnableInfo[8] slots</text>
<text x="350" y="174" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">up to 8 consumers</text>
<text x="350" y="194" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">restricted to PPL-AM</text>

