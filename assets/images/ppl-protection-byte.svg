<svg xmlns="http://www.w3.org/2000/svg" width="620" height="185" viewBox="0 0 620 185">
<rect width="620" height="185" fill="#0d1117" rx="8"/>
<text x="310" y="22" fill="#e6edf3" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold" text-anchor="middle">_PS_PROTECTION — 1-Byte Bitfield Layout</text>

<!-- bit position labels -->
<text x="69" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">7</text><text x="137" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">6</text><text x="205" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">5</text><text x="273" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">4</text><text x="341" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">3</text><text x="409" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">2</text><text x="477" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">1</text><text x="545" y="42" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">0</text>

<!-- Signer box (bits 7-4) -->
<rect x="35" y="50" width="272" height="54" fill="rgba(88,166,255,0.12)" stroke="#58a6ff" stroke-width="1.5" rx="4"/>
<text x="171" y="74" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold" text-anchor="middle">Signer</text>
<text x="171" y="92" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">bits 7–4  (4 bits)</text>

<!-- Audit box (bit 3) -->
<rect x="311" y="50" width="64" height="54" fill="rgba(240,136,62,0.12)" stroke="#f0883e" stroke-width="1.5" rx="4"/>
<text x="343" y="74" fill="#f0883e" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="bold" text-anchor="middle">Audit</text>
<text x="343" y="92" fill="#f0883e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">bit 3</text>

<!-- Type box (bits 2-0) -->
<rect x="379" y="50" width="206" height="54" fill="rgba(63,185,80,0.12)" stroke="#3fb950" stroke-width="1.5" rx="4"/>
<text x="482" y="74" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="13" font-weight="bold" text-anchor="middle">Type</text>
<text x="482" y="92" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">bits 2–0  (3 bits)</text>

<!-- Example -->
<text x="310" y="128" fill="#e6edf3" font-family="JetBrains Mono,Consolas,monospace" font-size="12" text-anchor="middle">MsMpEng.exe  ·  Level = 0x31  =  <tspan fill="#58a6ff">0011</tspan>  <tspan fill="#f0883e">0</tspan>  <tspan fill="#3fb950">001</tspan></text>
<text x="171" y="150" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">Signer=3 → Antimalware</text>
<text x="482" y="150" fill="#3fb950" font-family="JetBrains Mono,Consolas,monospace" font-size="11" text-anchor="middle">Type=1 → PPL</text>
<text x="310" y="172" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="10" text-anchor="middle">Formula: Level = (Signer &lt;&lt; 4) | Type  →  (3 &lt;&lt; 4) | 1 = 0x31</text>
</svg>