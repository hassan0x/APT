<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210">
<rect x="0" y="0" width="640" height="210" fill="#0f1f38" stroke="none" stroke-width="0" rx="8"/>
<text x="320" y="26" fill="#e6edf3" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">_PS_PROTECTION — 1-Byte Bitfield Layout</text>
<text x="70" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">7</text>
<text x="138" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">6</text>
<text x="206" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">5</text>
<text x="274" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">4</text>
<text x="342" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">3</text>
<text x="410" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">2</text>
<text x="478" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">1</text>
<text x="546" y="48" fill="#8b949e" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">0</text>
<rect x="36" y="56" width="272" height="56" fill="rgba(88,166,255,0.18)" stroke="#58a6ff" stroke-width="1.5" rx="4"/>
<text x="172" y="82" fill="#58a6ff" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Signer</text>
<text x="172" y="98" fill="#58a6ff" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">bits 7–4  (4 bits)</text>
<rect x="312" y="56" width="64" height="56" fill="rgba(240,136,62,0.18)" stroke="#f0883e" stroke-width="1.5" rx="4"/>
<text x="344" y="82" fill="#f0883e" font-size="12" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Audit</text>
<text x="344" y="98" fill="#f0883e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">bit 3</text>
<rect x="380" y="56" width="204" height="56" fill="rgba(63,185,80,0.18)" stroke="#3fb950" stroke-width="1.5" rx="4"/>
<text x="482" y="82" fill="#3fb950" font-size="13" font-family="JetBrains Mono,Consolas,monospace" font-weight="bold" text-anchor="middle">Type</text>
<text x="482" y="98" fill="#3fb950" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">bits 2–0  (3 bits)</text>
<text x="320" y="134" fill="#e6edf3" font-size="12" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">MsMpEng.exe  ·  Level = 0x31  =  <tspan fill="#58a6ff">0011</tspan> <tspan fill="#f0883e">0</tspan> <tspan fill="#3fb950">001</tspan></text>
<text x="172" y="158" fill="#58a6ff" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Signer=3 => Antimalware</text>
<text x="482" y="158" fill="#3fb950" font-size="11" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Type=1 => PPL (Light)</text>
<text x="320" y="182" fill="#8b949e" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Formula:  Level = (Signer &lt;&lt; 4) | Type   =>   (3 &lt;&lt; 4) | 1 = 0x31</text>
<text x="320" y="198" fill="#f85149" font-size="10" font-family="JetBrains Mono,Consolas,monospace" text-anchor="middle">Write 0x00 to this byte to remove all protection</text>
</svg>