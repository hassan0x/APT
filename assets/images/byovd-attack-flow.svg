<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#0f1f38" rx="8"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>BYOVD Attack Flow with RTCore64</text>

  <!-- USER-MODE layer -->
  <rect x="16" y="40" width="668" height="76" rx="6" fill="#192d44" stroke="#d29922" stroke-width="1"/>
  <text x="28" y="56" fill="#d29922" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>USER-MODE  (ring 3)</text>

  <rect x="40"  y="60" width="170" height="44" rx="4" fill="#0f1f38" stroke="#d29922" stroke-width="1"/>
  <text x="125" y="79"  text-anchor="middle" fill="#d29922" font-size="11" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Admin Process</text>
  <text x="125" y="96"  text-anchor="middle" fill="#8b949e"   font-size="9"  font-family='JetBrains Mono, Consolas, monospace'>SeLoadDriverPrivilege</text>

  <rect x="265" y="60" width="170" height="44" rx="4" fill="#0f1f38" stroke="#d29922" stroke-width="1"/>
  <text x="350" y="79"  text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>sc create + start</text>
  <text x="350" y="96"  text-anchor="middle" fill="#8b949e"   font-size="9"  font-family='JetBrains Mono, Consolas, monospace'>RTCore64.sys</text>

  <rect x="490" y="60" width="178" height="44" rx="4" fill="#0f1f38" stroke="#d29922" stroke-width="1"/>
  <text x="579" y="79"  text-anchor="middle" fill="#e3b341" font-size="11" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>DeviceIoControl</text>
  <text x="579" y="96"  text-anchor="middle" fill="#8b949e"   font-size="9"  font-family='JetBrains Mono, Consolas, monospace'>0x80002048 / 0x8000204C</text>

  <line x1="350" y1="118" x2="350" y2="142" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="136" fill="#3fb950" font-size="9" font-family='Segoe UI, Inter, sans-serif'>signed driver loads — passes Windows signature check</text>

  <!-- KERNEL-MODE layer -->
  <rect x="16" y="144" width="668" height="68" rx="6" fill="#192d44" stroke="#58a6ff" stroke-width="1"/>
  <text x="28" y="160" fill="#58a6ff" font-size="10" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>KERNEL-MODE  (ring 0)</text>

  <rect x="210" y="162" width="280" height="40" rx="4" fill="#0f1f38" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="179" text-anchor="middle" fill="#58a6ff"  font-size="13" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>RTCore64.sys</text>
  <text x="350" y="196" text-anchor="middle" fill="#8b949e"  font-size="10" font-family='Segoe UI, Inter, sans-serif'>MSI Afterburner driver  ·  Authenticode signed</text>

  <rect x="444" y="158" width="82" height="15" rx="3" fill="#f85149"/>
  <text x="485" y="169" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>VULNERABLE</text>

  <line x1="350" y1="214" x2="350" y2="238" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <text x="358" y="232" fill="#3fb950" font-size="9" font-family='Segoe UI, Inter, sans-serif'>arbitrary kernel read/write — no address validation</text>

  <!-- Three target boxes -->
  <rect x="20"  y="240" width="202" height="90" rx="5" fill="#192d44" stroke="#f85149"    stroke-width="1"/>
  <text x="121" y="262" text-anchor="middle" fill="#f85149"    font-size="12" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Strip PPL</text>
  <text x="121" y="280" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='JetBrains Mono, Consolas, monospace'>EPROCESS+0x6FA = 0</text>
  <text x="121" y="298" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>Open / kill Defender</text>
  <text x="121" y="314" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>or inject into lsass</text>

  <rect x="249" y="240" width="202" height="90" rx="5" fill="#192d44" stroke="#d29922" stroke-width="1"/>
  <text x="350" y="262" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Kill Callbacks</text>
  <text x="350" y="280" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='JetBrains Mono, Consolas, monospace'>slot=0 / Active=0</text>
  <text x="350" y="298" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>Blind process/thread</text>
  <text x="350" y="314" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>image + Ob + Cm</text>

  <rect x="478" y="240" width="202" height="90" rx="5" fill="#192d44" stroke="#bc8cff" stroke-width="1"/>
  <text x="579" y="262" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold" font-family='Segoe UI, Inter, sans-serif'>Disable ETW-TI</text>
  <text x="579" y="280" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='JetBrains Mono, Consolas, monospace'>IsEnabled = 0</text>
  <text x="579" y="298" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>Blind threat intel</text>
  <text x="579" y="314" text-anchor="middle" fill="#8b949e"   font-size="10" font-family='Segoe UI, Inter, sans-serif'>telemetry consumers</text>

  <text x="350" y="390" text-anchor="middle" fill="#8b949e" font-size="9" font-family='Segoe UI, Inter, sans-serif'>All three use the same kread32/kwrite32 primitives — one DeviceIoControl per operation</text>
</svg>